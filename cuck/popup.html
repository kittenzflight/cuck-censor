<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .status {
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 10px;
    }
    .info {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0b7dda;
    }
  </style>
</head>
<body>
  <h2>🛡️ Site Blocker</h2>
  <div class="status">
    Protection Active
  </div>
  <div class="info">
    <p>Blocking explicit websites to keep your browsing safe.</p>
    <p><strong>Sites blocked:</strong> <span id="count">37</span></p>
  </div>
  <button id="viewList">View Blocked Sites</button>
  <script src="popup.js"></script>
</body>
</html>
